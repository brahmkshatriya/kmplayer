name: Publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish
        required: true
        type: string
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        env:
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            version="$MANUAL_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9A-Za-z][0-9A-Za-z._-]*$ || "$version" == *SNAPSHOT* ]]; then
            echo "Invalid Maven release version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  platform:
    name: Publish ${{ matrix.name }} shard
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: android
            name: Android
            runner: ubuntu-24.04
            android: true
            tasks: ':kmplayer:publishAndroidPublicationToReleaseShardRepository :kmplayer-compose:publishAndroidPublicationToReleaseShardRepository'
          - id: js
            name: JavaScript
            runner: ubuntu-24.04
            tasks: ':kmplayer:publishJsPublicationToReleaseShardRepository :kmplayer-compose:publishJsPublicationToReleaseShardRepository'
          - id: wasm-js
            name: WasmJS
            runner: ubuntu-24.04
            tasks: ':kmplayer:publishWasmJsPublicationToReleaseShardRepository :kmplayer-compose:publishWasmJsPublicationToReleaseShardRepository'
          - id: linux-x64
            name: Linux x64
            runner: ubuntu-24.04
            linux: x64
            tasks: ':kmplayer:publishLinuxX64PublicationToReleaseShardRepository :kmplayer-compose:publishLinuxX64PublicationToReleaseShardRepository'
          - id: linux-arm64
            name: Linux arm64
            runner: ubuntu-24.04
            linux: arm64
            tasks: ':kmplayer:publishLinuxArm64PublicationToReleaseShardRepository :kmplayer-compose:publishLinuxArm64PublicationToReleaseShardRepository'
          - id: windows-x64
            name: Windows x64
            runner: windows-2025
            tasks: ':kmplayer:publishMingwX64PublicationToReleaseShardRepository :kmplayer-compose:publishMingwX64PublicationToReleaseShardRepository'
          - id: macos-x64
            name: macOS x64
            runner: macos-15-intel
            expected_arch: x86_64
            tasks: ':kmplayer:publishMacosX64PublicationToReleaseShardRepository :kmplayer-compose:publishMacosX64PublicationToReleaseShardRepository'
          - id: macos-arm64
            name: macOS arm64
            runner: macos-15
            expected_arch: arm64
            tasks: ':kmplayer:publishMacosArm64PublicationToReleaseShardRepository :kmplayer-compose:publishMacosArm64PublicationToReleaseShardRepository'
          - id: ios-arm64
            name: iOS arm64
            runner: macos-15
            expected_arch: arm64
            tasks: ':kmplayer:publishIosArm64PublicationToReleaseShardRepository :kmplayer-compose:publishIosArm64PublicationToReleaseShardRepository'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6

      - uses: android-actions/setup-android@v4
        if: matrix.android == true
      - name: Install Android SDK
        if: matrix.android == true
        shell: bash
        run: |
          sdk_platform="$(sed -n 's/^androidSdkPlatformVersion=//p' gradle.properties)"
          build_tools="$(sed -n 's/^androidBuildToolsVersion=//p' gradle.properties)"
          sdkmanager "platforms;android-${sdk_platform}" "build-tools;${build_tools}"

      - name: Install Linux native dependencies
        if: matrix.linux
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
          if [[ "${{ matrix.linux }}" == "arm64" ]]; then
            sudo apt-get install --yes gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
          fi

      - name: Verify runner architecture
        if: matrix.expected_arch
        shell: bash
        env:
          EXPECTED_ARCH: ${{ matrix.expected_arch }}
        run: test "$(uname -m)" = "$EXPECTED_ARCH"

      - name: Verify Xcode
        if: startsWith(matrix.id, 'macos-') || startsWith(matrix.id, 'ios-')
        shell: bash
        run: xcodebuild -version

      - name: Verify Windows native toolchain
        if: matrix.id == 'windows-x64'
        shell: bash
        run: |
          clang++ --version
          llvm-ar --version

      - name: Build Maven publication shard
        shell: bash
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
          TARGET_TASKS: ${{ matrix.tasks }}
          LINUX_ARCH: ${{ matrix.linux }}
        run: |
          set -euo pipefail
          rm -rf build/maven-release-shard

          if [[ "$LINUX_ARCH" == "arm64" ]]; then
            export KMPLAYER_LINUX_ARM64_CC=aarch64-linux-gnu-gcc
            export KMPLAYER_LINUX_ARM64_AR=aarch64-linux-gnu-ar
            export KMPLAYER_LINUX_ARM64_CFLAGS="$(pkg-config --cflags gstreamer-1.0 gstreamer-video-1.0 gstreamer-app-1.0)"
          fi

          ./gradlew --no-daemon --stacktrace --no-configuration-cache $TARGET_TASKS
          test -d build/maven-release-shard/dev/brahmkshatriya/kmplayer

      - uses: actions/upload-artifact@v4
        with:
          name: kmplayer-repo-${{ matrix.id }}-${{ needs.prepare.outputs.version }}
          path: build/maven-release-shard
          if-no-files-found: error
          retention-days: 5

  metadata:
    name: Publish KMP root metadata shard
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Linux metadata dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            pkg-config \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev
      - name: Publish KMP roots
        shell: bash
        env:
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf build/maven-release-shard
          ./gradlew --no-daemon --stacktrace --no-configuration-cache \
            :kmplayer:publishKotlinMultiplatformPublicationToReleaseShardRepository \
            :kmplayer-compose:publishKotlinMultiplatformPublicationToReleaseShardRepository
      - uses: actions/upload-artifact@v4
        with:
          name: kmplayer-repo-metadata-${{ needs.prepare.outputs.version }}
          path: build/maven-release-shard
          if-no-files-found: error
          retention-days: 5

  publish:
    name: Sign and publish Maven Central deployment
    needs: [prepare, platform, metadata]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v4
        with:
          pattern: kmplayer-repo-*-${{ needs.prepare.outputs.version }}
          path: release/shards

      - name: Merge Maven shards
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release/merged
          for repository in release/shards/kmplayer-repo-*; do
            cp -a "$repository/." release/merged/
          done

      - name: Verify merged target set
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          root="release/merged/dev/brahmkshatriya/kmplayer"
          modules=(
            kmplayer kmplayer-compose
            kmplayer-android kmplayer-js kmplayer-wasm-js kmplayer-linuxx64 kmplayer-linuxarm64 kmplayer-mingwx64 kmplayer-macosx64 kmplayer-macosarm64 kmplayer-iosarm64
            kmplayer-compose-android kmplayer-compose-js kmplayer-compose-wasm-js kmplayer-compose-linuxx64 kmplayer-compose-linuxarm64 kmplayer-compose-mingwx64 kmplayer-compose-macosx64 kmplayer-compose-macosarm64 kmplayer-compose-iosarm64
          )
          for module in "${modules[@]}"; do
            directory="$root/$module/$RELEASE_VERSION"
            test -d "$directory" || { echo "Missing publication: $module" >&2; exit 1; }
            test -n "$(find "$directory" -maxdepth 1 -name '*.pom' -print -quit)" || { echo "Missing POM: $module" >&2; exit 1; }
          done
          if find "$root" -type f \( -name '*.pom' -o -name '*.module' \) -exec grep -Il 'SNAPSHOT' {} + | grep -q .; then
            echo 'SNAPSHOT metadata leaked into release repository' >&2
            exit 1
          fi

      - name: Restore Maven Central credentials and signing key
        shell: bash
        env:
          GRADLE_PROPERTIES_CONTENT: ${{ secrets.GRADLE_PROPERTIES_CONTENT }}
          GPG_SECRET_KEY_RING_BASE64: ${{ secrets.GPG_SECRET_KEY_RING_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$GRADLE_PROPERTIES_CONTENT"
          test -n "$GPG_SECRET_KEY_RING_BASE64"
          gradle_dir="$HOME/.gradle"
          properties_file="$gradle_dir/gradle.properties"
          keyring="$gradle_dir/kmplayer-secret-key.gpg"
          mkdir -p "$gradle_dir"
          printf '%s' "$GRADLE_PROPERTIES_CONTENT" > "$properties_file"
          printf '%s' "$GPG_SECRET_KEY_RING_BASE64" | tr -d '\r\n ' | openssl base64 -d -A > "$keyring"
          test -s "$keyring"
          awk '!/^signing.secretKeyRingFile=/' "$properties_file" > "$properties_file.tmp"
          mv "$properties_file.tmp" "$properties_file"
          printf '\nsigning.secretKeyRingFile=%s\n' "$keyring" >> "$properties_file"
          chmod 600 "$properties_file" "$keyring"
          for property in mavenCentralUsername mavenCentralPassword signing.keyId signing.password; do
            grep -Eq "^${property//./\\.}=.+" "$properties_file" || {
              echo "GRADLE_PROPERTIES_CONTENT is missing required property '$property'" >&2
              exit 1
            }
          done

      - name: Sign and upload one Maven Central deployment
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          scripts/publish-maven-central-bundle.sh \
            "$GITHUB_WORKSPACE/release/merged" \
            "$RELEASE_VERSION" \
            "$GITHUB_WORKSPACE/release/kmplayer-$RELEASE_VERSION.zip"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-kmplayer-central-bundle-${{ needs.prepare.outputs.version }}
          path: release/kmplayer-${{ needs.prepare.outputs.version }}.zip
          if-no-files-found: ignore
          retention-days: 5
